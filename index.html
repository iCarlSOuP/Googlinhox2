    <meta charset="UTF-8">

    <title>Ginhox2Bob</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
      }
      body{
        display:flex;
        justify-content:center;
        align-items:center;
        width:100%;
        height:100vh;
        overflow:hidden;
        font-family: 'Goldman', sans-serif;
        background-color: #000000;
        color: #DB0000;
      }
      .loader-wrapper{
        position:relative;
        animation: fadeIn 0.6s ease-out, float 2.4s ease-in-out 0.6s infinite;
      }
      .loader{
        display:block; width:100%; max-width:420px; height:auto;
        border-radius:22px;
      }
      .loading-text {
        position: absolute;
        bottom: -40px;
        width: 100%;
        text-align: center;
        font-size: 14px;
        letter-spacing: 2px;
        animation: blinkText 1.5s infinite;
      }
      @keyframes fadeIn{
        from{opacity:0;
        transform:scale(.94);}
        to{opacity:1; transform:scale(1);}
      }
      @keyframes float{
        0%{transform:translateY(0px);}
        50%{transform:translateY(-6px);}
        100%{transform:translateY(0px);}
      }
      @keyframes blinkText {
        0%, 100% { opacity: 1;
        text-shadow: 0 0 8px rgba(219,0,0,0.5); }
        50% { opacity: 0.4; text-shadow: none;
        }
      }
      @media (max-width:480px){
        .loader{ max-width:280px;
        border-radius:18px; }
      }
      @media (min-width:1024px){
        .loader{ max-width:560px;
        }
      }
    </style>
  </head>
